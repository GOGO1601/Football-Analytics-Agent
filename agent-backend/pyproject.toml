[project]
name = "football-agents"
version = "0.1.0"
requires-python = ">=3.11"
# Core = the deterministic analytics engine (data/ + tools/). Everything else is optional,
# so tests and CI stay fast until the agent layer actually exists.
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "playwright"]                       # playwright only for regenerating the JS fixture
api = ["fastapi", "uvicorn[standard]", "pydantic-settings", "python-dotenv", "httpx"]
agents = ["langgraph>=1.0,<2", "langchain-groq", "diskcache"]
observability = ["mlflow", "arize-phoenix", "openinference-instrumentation-langchain"]
crewai = ["crewai"]

[tool.setuptools.packages.find]
include = ["app*", "data*", "tools*", "agents*", "llm*", "observability*", "evals*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
